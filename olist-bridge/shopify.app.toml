# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a7416eeff603361edb2289aa87affff1"
name = "clientes-login-TT"
application_url = "https://app.mibrobrasil.com.br"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_discounts,read_orders,read_customers,customer_read_customers,customer_read_orders"


[webhooks]
api_version = "2026-07"


  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[[webhooks.subscriptions]]
topics = ["orders/paid"]
uri = "/webhooks/orders/paid"

[auth]
redirect_urls = [ "https://app.mibrobrasil.com.br/auth/callback" ]

[app_proxy]
url = "https://app.mibrobrasil.com.br/apps/cnpj-validator"
subpath = "cnpj-validator"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
